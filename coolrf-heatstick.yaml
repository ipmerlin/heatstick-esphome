substitutions:
  name: ballu-heatstick
  friendly_name: Ballu Digital Inverter

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: coolrf.heatstick
    version: "0.2.3-dev"

esp8266:
  board: esp8285

external_components:
  - source:
      type: local
      path: components

logger:
  # UART0 is connected to the heater, so serial logging must stay disabled.
  baud_rate: 0
  level: INFO

api:

web_server:
  port: 80
  version: 3
  local: true

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:

uart:
  id: heatstick_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  stop_bits: 1

heatstick:
  id: heatstick_hub
  uart_id: heatstick_uart
  request_interval: 60s
  climate:
    id: heatstick_climate
    name: Climate
  power:
    id: heatstick_power
    name: Power level
  mode:
    id: heatstick_mode
    name: Operating mode
  display:
    id: heatstick_display
    name: Display
  current_temperature:
    name: Current temperature
  target_temperature:
    name: Target temperature
    disabled_by_default: true
  power_level:
    name: Current power level

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

globals:
  - id: led_tick
    type: uint8_t
    restore_value: false
    initial_value: "0"
  - id: pairing_button_held
    type: bool
    restore_value: false
    initial_value: "false"

output:
  - platform: gpio
    id: heatstick_led_output
    pin: GPIO13

switch:
  - platform: template
    id: heatstick_led
    name: LED
    icon: mdi:led-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_off_action:
      - output.turn_off: heatstick_led_output

binary_sensor:
  - platform: gpio
    id: heatstick_pairing_button
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - lambda: id(pairing_button_held) = true;
      - script.execute: enter_wifi_pairing
    on_release:
      - lambda: id(pairing_button_held) = false;
      - script.stop: enter_wifi_pairing

script:
  - id: enter_wifi_pairing
    mode: restart
    then:
      - delay: 5s
      - lambda: |-
          ESP_LOGW("pairing", "Factory reset requested; starting Wi-Fi pairing mode");
          global_preferences->reset();

          // Keep one deliberately unavailable STA entry so newly entered
          // captive-portal credentials use the normal configuration key and
          // are loaded again after the next reboot.
          wifi::WiFiAP pairing_ap;
          pairing_ap.set_ssid("__heatstick_pairing__");
          wifi::global_wifi_component->disable();
          wifi::global_wifi_component->set_sta(pairing_ap);
          wifi::global_wifi_component->set_ap_timeout(1000);
          wifi::global_wifi_component->enable();

interval:
  - interval: 250ms
    then:
      - lambda: |-
          id(led_tick)++;

          // Solid while the physical button is held.
          if (id(pairing_button_held)) {
            id(heatstick_led_output).turn_on();
            return;
          }

          // The HA/web switch disables all automatic indication.
          if (!id(heatstick_led).state) {
            id(heatstick_led_output).turn_off();
            return;
          }

          // Fast blink: fallback AP/captive portal is ready for pairing.
          if (wifi::global_wifi_component->is_ap_active()) {
            if ((id(led_tick) & 1U) == 0U)
              id(heatstick_led_output).turn_on();
            else
              id(heatstick_led_output).turn_off();
            return;
          }

          // Short flash every two seconds: Wi-Fi connection is lost.
          if (!wifi::global_wifi_component->is_connected()) {
            if ((id(led_tick) % 8U) == 0U)
              id(heatstick_led_output).turn_on();
            else
              id(heatstick_led_output).turn_off();
            return;
          }

          // Normal connected state.
          id(heatstick_led_output).turn_off();

button:
  - platform: restart
    name: Restart
