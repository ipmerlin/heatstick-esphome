substitutions:
  name: ballu-heatstick
  friendly_name: Ballu Digital Inverter

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: coolrf.heatstick
    version: "0.2.2-dev"

esp8266:
  board: esp8285

external_components:
  - source:
      type: local
      path: components

logger:
  # UART0 is connected to the heater, so serial logging must stay disabled.
  baud_rate: 0
  level: INFO

api:

web_server:
  port: 80
  version: 3
  local: true

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:

uart:
  id: heatstick_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  stop_bits: 1

heatstick:
  id: heatstick_hub
  uart_id: heatstick_uart
  request_interval: 60s
  climate:
    id: heatstick_climate
    name: Climate
  power:
    id: heatstick_power
    name: Power level
  mode:
    id: heatstick_mode
    name: Operating mode
  display:
    id: heatstick_display
    name: Display
  current_temperature:
    name: Current temperature
  target_temperature:
    name: Target temperature
    disabled_by_default: true
  power_level:
    name: Current power level

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

button:
  - platform: restart
    name: Restart
